<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <title>ChromaSense</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== DARK THEME (Default) ===== */
    :root {
      --bg:         #b3b3dc;
      --surface:    #8e8ed5;
      --sur2:       #a4a4cf;
      --sur3:       #9b9bcc;
      --border:     rgba(255,255,255,0.08);
      --text:       #F0EFF8;
      --muted:      rgba(240,239,248,0.45);
      --accent:     #7C6FFF;
      --accent2:    #FF6B9D;
      --green:      #3DDB8A;
      --red:        #FF6B6B;
      --yellow:     #FFD166;
      --orange:     #FF8C42;
      --cyan:       #4ECDC4;
      --blue:       #45B7D1;
      --gold:       #F9A825;
      --shadow:     rgba(0,0,0,0.4);
      --glow:       rgba(124,111,255,0.3);
    }

    /* ===== LIGHT THEME ===== */
    [data-theme="light"] {
      --bg:         #F8F9FC;
      --surface:    #FFFFFF;
      --sur2:       #F0F2F5;
      --sur3:       #E8EBF0;
      --border:     rgba(0,0,0,0.08);
      --text:       #1A1A2E;
      --muted:      rgba(26,26,46,0.55);
      --accent:     #6B5CE7;
      --accent2:    #E85D8A;
      --green:      #2CB67D;
      --red:        #E74C3C;
      --yellow:     #F39C12;
      --orange:     #E67E22;
      --cyan:       #1ABC9C;
      --blue:       #3498DB;
      --gold:       #D4AC0D;
      --shadow:     rgba(0,0,0,0.08);
      --glow:       rgba(107,92,231,0.2);
    }

    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ---- Header ---- */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--surface) 0%, var(--sur2) 100%);
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700;
    }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px var(--glow);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .logo-icon svg {
      width: 18px; height: 18px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
    }
    @keyframes pulse {
      0%,100% { transform:scale(1); box-shadow:0 4px 15px var(--glow); }
      50%      { transform:scale(1.05); box-shadow:0 6px 25px var(--glow); }
    }
    .header-right {
      display: flex; align-items: center; gap: 10px;
    }
    .ver { 
      font-size: 0.65rem; color: var(--muted); 
      background: var(--sur2); padding: 3px 10px; border-radius: 100px;
      border: 1px solid var(--border);
    }

    /* ---- Theme Toggle ---- */
    .theme-btn {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--sur2); border: 1px solid var(--border);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    .theme-btn:hover {
      background: var(--sur3); border-color: var(--accent);
      transform: translateY(-1px);
    }
    .theme-btn svg {
      width: 16px; height: 16px;
      fill: var(--muted);
      transition: fill 0.2s;
    }
    .theme-btn:hover svg { fill: var(--accent); }

    /* ---- Content ---- */
    .content { padding: 16px 18px; }

    /* ---- Status card ---- */
    .status-card {
      background: linear-gradient(135deg, var(--surface) 0%, var(--sur2) 100%);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px var(--shadow);
      transition: all 0.3s ease;
    }
    .status-card:hover {
      border-color: rgba(124,111,255,0.2);
      transform: translateY(-1px);
    }
    .status-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 4px; }
    .status-value { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; }
    .status-value.on  { color: var(--green); text-shadow: 0 0 20px rgba(61,219,138,0.3); }
    .status-value.off { color: var(--muted); }

    /* Toggle switch */
    .toggle { position:relative; width:52px; height:28px; cursor:pointer; }
    .toggle input { opacity:0; width:0; height:0; }
    .track {
      position:absolute; inset:0; border-radius:14px;
      background:var(--sur2); border:1px solid var(--border);
      transition:all 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .track::after {
      content:''; position:absolute; top:3px; left:3px;
      width:20px; height:20px; border-radius:50%;
      background:var(--muted); transition:all 0.3s cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .toggle input:checked + .track { 
      background: linear-gradient(135deg, rgba(124,111,255,0.3), rgba(255,107,157,0.2)); 
      border-color:var(--accent); 
    }
    .toggle input:checked + .track::after { 
      transform:translateX(24px); 
      background:var(--accent); 
      box-shadow:0 0 15px rgba(124,111,255,0.8), 0 2px 8px rgba(0,0,0,0.2); 
    }

    /* ---- Profile card ---- */
    .profile-card {
      border-radius: 16px; padding: 16px 18px; margin-bottom: 16px;
      border: 1px solid rgba(124,111,255,0.2);
      background: linear-gradient(135deg, rgba(124,111,255,0.12), rgba(154,95,255,0.06));
      box-shadow: 0 4px 20px var(--shadow);
      transition: all 0.3s ease;
    }
    .profile-card:hover {
      border-color: rgba(124,111,255,0.3);
      transform: translateY(-1px);
    }
    .profile-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .profile-row:last-child { margin-bottom:0; }
    .pk { font-size:0.62rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.1em; }
    .pv { font-size:0.85rem; font-weight:600; color:var(--text); }
    .pv.active-type { color:var(--accent); font-family:'Syne',sans-serif; font-size:0.92rem; text-shadow: 0 0 20px var(--glow); }

    /* Severity dot */
    .sev-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; box-shadow: 0 0 8px currentColor; }
    .sev-none     { background:var(--green); color:var(--green); }
    .sev-mild     { background:var(--yellow); color:var(--yellow); }
    .sev-moderate { background:var(--orange); color:var(--orange); }
    .sev-severe   { background:var(--red); color:var(--red); }

    /* Score bar */
    .score-wrap { margin-bottom:16px; }
    .score-row  { display:flex; justify-content:space-between; font-size:0.7rem; color:var(--muted); margin-bottom:6px; }
    .score-track { height:6px; background:var(--sur2); border-radius:100px; overflow:hidden; }
    .score-fill  { height:100%; border-radius:100px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width 0.8s cubic-bezier(0.22,1,0.36,1); box-shadow: 0 0 10px rgba(124,111,255,0.3); }

    /* ---- Section label ---- */
    .sec-label {
      font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.12em;
      color:var(--muted); margin-bottom:10px; display:flex; align-items:center; gap:8px;
    }
    .sec-label::before {
      content:''; width:4px; height:4px; border-radius:50%; background:var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* ---- CVD Type buttons (7 buttons: Auto + 6 types) ---- */
    .type-grid {
      display:grid; grid-template-columns:1fr 1fr 1fr;
      gap:8px; margin-bottom:16px;
    }
    .type-btn {
      background:linear-gradient(135deg, var(--surface) 0%, var(--sur2) 100%);
      border:1px solid var(--border);
      color:var(--muted); font-family:'DM Sans',sans-serif;
      font-size:0.7rem; font-weight:500;
      padding:10px 8px; border-radius:10px; cursor:pointer;
      text-align:center; transition:all 0.2s cubic-bezier(0.22,1,0.36,1);
      line-height:1.4;
      position: relative;
      overflow: hidden;
    }
    .type-btn::before {
      content:''; position:absolute; inset:0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.05));
      opacity: 0; transition: opacity 0.2s;
    }
    .type-btn:hover::before { opacity: 1; }
    .type-btn:hover { 
      border-color:rgba(124,111,255,0.4); 
      color:var(--text); 
      transform: translateY(-2px);
      box-shadow: 0 4px 15px var(--shadow);
    }
    .type-btn.active { 
      border-color:var(--accent); 
      background:linear-gradient(135deg, rgba(124,111,255,0.2), rgba(154,95,255,0.1)); 
      color:var(--accent); 
      font-weight:600;
      box-shadow: 0 0 20px var(--glow);
    }
    .type-btn.auto-btn { grid-column:1/-1; font-size:0.78rem; color:var(--text); padding:12px; }

    /* CVD type color accents on hover/active */
    .type-btn[data-type="Protanopia"]:hover,
    .type-btn[data-type="Protanopia"].active    { border-color:var(--red); color:var(--red); background:linear-gradient(135deg, rgba(255,107,107,0.15), rgba(255,107,107,0.05)); box-shadow: 0 0 15px rgba(255,107,107,0.2); }
    .type-btn[data-type="Protanomaly"]:hover,
    .type-btn[data-type="Protanomaly"].active   { border-color:var(--orange); color:var(--orange); background:linear-gradient(135deg, rgba(255,140,66,0.15), rgba(255,140,66,0.05)); box-shadow: 0 0 15px rgba(255,140,66,0.2); }
    .type-btn[data-type="Deuteranopia"]:hover,
    .type-btn[data-type="Deuteranopia"].active  { border-color:var(--cyan); color:var(--cyan); background:linear-gradient(135deg, rgba(78,205,196,0.15), rgba(78,205,196,0.05)); box-shadow: 0 0 15px rgba(78,205,196,0.2); }
    .type-btn[data-type="Deuteranomaly"]:hover,
    .type-btn[data-type="Deuteranomaly"].active { border-color:var(--blue); color:var(--blue); background:linear-gradient(135deg, rgba(69,183,209,0.15), rgba(69,183,209,0.05)); box-shadow: 0 0 15px rgba(69,183,209,0.2); }
    .type-btn[data-type="Tritanopia"]:hover,
    .type-btn[data-type="Tritanopia"].active    { border-color:var(--yellow); color:var(--yellow); background:linear-gradient(135deg, rgba(255,209,102,0.15), rgba(255,209,102,0.05)); box-shadow: 0 0 15px rgba(255,209,102,0.2); }
    .type-btn[data-type="Tritanomaly"]:hover,
    .type-btn[data-type="Tritanomaly"].active   { border-color:var(--gold); color:var(--gold); background:linear-gradient(135deg, rgba(249,168,37,0.15), rgba(249,168,37,0.05)); box-shadow: 0 0 15px rgba(249,168,37,0.2); }

    /* ---- No profile state ---- */
    .no-profile { text-align:center; padding:28px 0 16px; }
    .no-profile-icon { 
      width: 64px; height: 64px; margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 30px var(--glow);
      animation: float 3s ease-in-out infinite;
    }
    .no-profile-icon svg { width: 32px; height: 32px; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .no-profile h3 { font-family:'Syne',sans-serif; font-size:1.05rem; font-weight:700; margin-bottom:8px; }
    .no-profile p  { font-size:0.82rem; color:var(--muted); line-height:1.6; margin-bottom:18px; padding: 0 10px; }
    .btn-take-test {
      width:100%; padding:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white; border:none; border-radius:12px;
      font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:600;
      cursor:pointer; transition:all 0.25s cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 4px 20px var(--glow);
    }
    .btn-take-test:hover { 
      transform:translateY(-2px); 
      box-shadow: 0 8px 30px var(--glow);
    }
    .btn-take-test:active { transform:translateY(0); }

    /* ---- Footer ---- */
    .footer {
      padding:14px 18px; border-top:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:center;
      background: linear-gradient(135deg, var(--surface) 0%, var(--sur2) 100%);
    }
    .footer-link { 
      font-size:0.72rem; color:var(--muted); cursor:pointer; text-decoration:none; 
      transition:all 0.2s; padding: 6px 12px; border-radius: 8px;
    }
    .footer-link:hover { 
      color:var(--accent); 
      background: rgba(124,111,255,0.1);
    }

    /* ---- Info Cards ---- */
    .info-card {
      background: linear-gradient(135deg, var(--sur2) 0%, var(--sur3) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .info-card-title {
      font-size: 0.75rem; font-weight: 600; color: var(--text);
      margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
    }
    .info-card-desc {
      font-size: 0.72rem; color: var(--muted); line-height: 1.5;
    }
    .cvd-icon { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .content { animation:fadeUp 0.4s cubic-bezier(0.22,1,0.36,1); }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
        <path d="M2 12h20"/>
      </svg>
    </div>
    ChromaSense
  </div>
  <div class="header-right">
    <button class="theme-btn" id="theme-toggle" title="Toggle theme">
      <svg id="theme-icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="theme-icon-sun" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
    <span class="ver">v2.0</span>
  </div>
</div>

<div class="content" id="popup-content">
  <div style="text-align:center;padding:28px;color:var(--muted);font-size:0.82rem;">Loading...</div>
</div>

<div class="footer">
  <a class="footer-link" id="link-app" href="#">Open Test App ↗</a>
  <a class="footer-link" id="link-reset" href="#">Reset Profile</a>
</div>

<script src="popup.js"></script>
</body>
</html>
